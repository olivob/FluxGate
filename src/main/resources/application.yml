server:
  port: 8080

fluxgate:
  openai:
    enabled: ${OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    connect-timeout: 5s
    request-timeout: 30s
    max-output-tokens: 1024

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fluxgate
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate # important: let Liquibase own schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # datasource:
  #   url: jdbc:h2:mem:fluxgate_test;DB_CLOSE_DELAY=-1
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password:
  application:
    name: fluxgate

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
